# CTP Core sync rules — the security boundary for every phone.
#
# PowerSync replicates as `powersync_role`, which is BYPASSRLS. Migration 0015's
# grants and rls.sql's 41 policies protect the Data API and nothing else. What
# actually lands in a device's local SQLite is decided HERE and only here, so a
# missing gate in this file is a data leak, not a bug.
#
# ── WHY THIS IS EDITION 2 AND NOT STREAMS (edition 3) ────────────────────────
# Two reasons, both found the hard way on 2026-08-12:
#
# 1. Edition 3 could not express this gate at all. A stream query filtered ONLY
#    on `auth.parameter('user_role')` has no column to partition a bucket on,
#    and the service rejects it: "This table-valued function depends on request
#    data and can't be partitioned."
#
# 2. More seriously — GHSA-q6wc-xx4m-92fj. In edition 3, subquery filters whose
#    only job was to GATE a table (rather than partition it) were SILENTLY
#    IGNORED, and the tables synced to every authenticated user. That advisory's
#    own example is this exact intent. A gate that fails open without saying so
#    is worse than no gate, because you stop checking.
#
#    Edition 2 parameter queries are explicitly NOT affected, and they are the
#    mechanism designed for this: a `parameters:` query with NO OUTPUT COLUMNS
#    is a pure yes/no — return a row and the bucket syncs, return nothing and it
#    does not exist for that device.
#
# ── the gate ─────────────────────────────────────────────────────────────────
# Each definition below asks one question: "does the person holding this token
# have a row in app_user, and is their role allowed?" That is deliberately
# checked against the DATABASE ROW rather than the `user_role` JWT claim alone —
# the claim decides nothing here, so a stale or forged token still cannot widen
# access, and revoking someone is an UPDATE, not a wait for their token to
# expire. (0019's claim still matters: the app reads it to decide what to draw.)
#
# ── verify on the DEVICE, never from this file ───────────────────────────────
# A bucket that syncs nothing and a bucket that was never written look identical
# here. On a client login, in the browser console:
#     await powerSync.getAll("SELECT count(*) n FROM part_cost")    -- expect 0
#     await powerSync.getAll("SELECT count(*) n FROM price")        -- expect 0
#     await powerSync.getAll("SELECT count(*) n FROM stock_policy") -- expect 0
#     await powerSync.getAll("SELECT count(*) n FROM sales_order")  -- expect 0
#     await powerSync.getAll("SELECT count(*) n FROM part")         -- expect 161
# Do that BEFORE anyone outside the business is given a password.

bucket_definitions:

  # ══ STAFF — catalogue + operations ══════════════════════════════════════
  # Carries bins, stock movements, every customer record and every order.
  ctp_data:
    parameters: |
      SELECT FROM app_user
       WHERE id = request.user_id()
         AND (role = 'sales' OR role = 'warehouse'
           OR role = 'manager' OR role = 'admin')
    data:
      - SELECT * FROM category
      - SELECT * FROM brand
      - SELECT * FROM part
      - SELECT * FROM part_xref
      - SELECT * FROM vehicle_model
      - SELECT * FROM part_fitment
      - SELECT * FROM location
      - SELECT * FROM stock_movement
      - SELECT * FROM stock_policy
      - SELECT * FROM price
      - SELECT * FROM customer
      - SELECT * FROM sales_order
      - SELECT * FROM sales_line
      - SELECT * FROM company
      - SELECT * FROM diagram
      - SELECT * FROM part_diagram_callout
      - SELECT * FROM part_image
      - SELECT * FROM part_model
      - SELECT * FROM hotspot

  # ══ STAFF — the commercially sensitive three ════════════════════════════
  # part_cost  — what we paid. Never leaves the business.
  # price_tier — discount_bps + min_margin_bps, i.e. how low we will go.
  # part_alias — Jefrey's learned phrase->part mappings.
  # Kept separate so it can be narrowed to managers later without touching
  # anything else.
  ctp_staff:
    parameters: |
      SELECT FROM app_user
       WHERE id = request.user_id()
         AND (role = 'sales' OR role = 'warehouse'
           OR role = 'manager' OR role = 'admin')
    data:
      - SELECT * FROM part_cost
      - SELECT * FROM price_tier
      - SELECT * FROM part_alias

  # ══ CLIENT ══════════════════════════════════════════════════════════════
  # What a customer's phone may hold. Columns are listed ONE BY ONE on purpose:
  # `SELECT *` on `part` would ship list_price_minor, locator, inventory_pn and
  # notes, and would publish any future column the day it is added. An explicit
  # list fails safe — a new column simply does not sync.
  #
  # Deliberately absent, each for a reason:
  #   price, part_cost, price_tier      — Ian quotes per customer
  #   stock_policy, location            — bins are the warehouse's internal map
  #   stock_movement                    — reveals sales volumes
  #   customer, sales_order, sales_line — other people's business
  #   part_alias                        — internal search training
  #   part_model                        — 37MB .glb, desktop-only anyway
  ctp_client:
    parameters: |
      SELECT FROM app_user
       WHERE id = request.user_id()
         AND role = 'customer'
    data:
      - SELECT id, code, name, rev, updated_at, deleted_at FROM category
      - SELECT id, name, rev, updated_at, deleted_at FROM brand
      # no locator / inventory_pn / notes / list_price_minor / match_status.
      # catalogue_pn stays: the OEM number is how a customer finds the part.
      - SELECT id, sku, mpn, brand_id, category_id, name, description, uom,
               weight_g, status, superseded_by, make, model, drawing_no,
               diagram_item_no, catalogue_pn, side, diagram_ref,
               rev, updated_at, deleted_at
          FROM part
      - SELECT * FROM part_xref
      - SELECT * FROM vehicle_model
      - SELECT * FROM part_fitment
      - SELECT * FROM part_image
      - SELECT * FROM diagram
      - SELECT * FROM part_diagram_callout
      - SELECT * FROM hotspot
      - SELECT * FROM company

  # ══ CLIENT — their own requests: NOT YET ════════════════════════════════
  # Deliberately absent, and the reason is structural rather than a decision.
  #
  # `sales_order` alone would be easy — parameterise on the customer row that
  # points at this login and filter `customer_id = bucket.customer_id`. But
  # `sales_line` carries only `order_id`, so reaching the customer needs a JOIN,
  # and edition 2 DATA queries are single-table: no joins. An order header with
  # no lines is worse than nothing ("you asked for something, we won't say
  # what"), so neither ships.
  #
  # Two honest ways forward when this matters:
  #   a. denormalise — add `customer_id` to `sales_line`, maintained by the
  #      request RPC and by the desktop's add_line. One redundant column, but
  #      it makes the bucket trivial and the filter exact.
  #   b. leave it out — a customer submits through the app and hears back from
  #      Ian. That is how the business already works, and it ships today.
  #
  # Until one is chosen, a submitted request simply does not come back down to
  # the client's device. `request_parts` still works: it writes server-side.
